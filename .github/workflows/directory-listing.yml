name: Generate Listings for IITD and EFLU

on:
  push:
    branches:
      - main

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate listing for IITD
        uses: gacts/directory-listing@v1
        with:
          target: ./IITD
          # overwrite defaults to false, so any existing index.html here is safe
          # ignore defaults to '**/index.html', so nested index files are also protected

      - name: Generate listing for EFLU
        uses: gacts/directory-listing@v1
        with:
          target: ./EFLU
          # same defaults apply

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .          # publishes the entire repo root
          publish_branch: gh-pages # deploys to the gh-pages branch
